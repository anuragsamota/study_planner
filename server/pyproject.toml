[project]
name = "study-planner-mcp"
version = "1.0.0"
description = "MCP server for the AI-powered Study Planner app"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.20,<2",
  "uvicorn>=0.30",
  "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
study-planner-mcp = "study_planner_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["study_planner_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
